name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare logo
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            curl -fsSL -o assets/icon.png "https://storage.googleapis.com/bit-generated-images/images/image_modern_mobile_app_icon__square_0_1793531797099.png"
          fi
          cp -n assets/icon.png assets/adaptive-icon.png
          cp -n assets/icon.png assets/splash.png

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pipe-record-apk
          path: android/app/build/outputs/apk/release/*.apk
